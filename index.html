<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11151b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>NormAI Roadmap Public View</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="stylesheet" href="styles.css">
<script src="data.js" defer></script><script src="app.js" defer></script></head>
<body><header><a class="brand" href="#">Norm<span>AI</span><small>Roadmap · Public View</small></a><div class="tools"><button id="language">EN</button><button id="theme" aria-label="Тема">◐</button></div></header>
<main><section class="intro"><p class="eyebrow" id="eyebrow"></p><h1 id="heading"></h1><p id="intro"></p></section>
<section id="directions" class="direction-grid"></section>
<nav class="tabs"><button id="home"></button><button id="all"></button></nav>
<div class="filters"><label><span id="search-label"></span><input id="search" type="search" autocomplete="off"></label><label><span id="status-label"></span><select id="status"></select></label></div>
<section id="task-section" hidden><div class="list-heading"><h2 id="list-title"></h2><span id="count" aria-live="polite"></span></div><div id="tasks"></div><p id="empty" hidden></p></section>
<footer id="footnote"></footer><p id="error" role="alert" hidden>Не удалось загрузить обзор. Обновите страницу. / Unable to load the overview. Reload the page.</p></main>
<dialog id="details" aria-labelledby="task-title"><div class="dialog-top"><span id="detail-direction"></span><button id="close" aria-label="Закрыть">×</button></div><div id="detail-body"></div></dialog>
<noscript>Для просмотра обзора включите JavaScript. / Enable JavaScript to view the overview.</noscript></body></html>
